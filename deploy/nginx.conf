# Сайт и API платформы с одного адреса: страница обращается к /api/... без обхода политики безопасности (CSP connect-src 'self')
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # каталог (/api/v1/bundle) API сжимает сам и отдаёт с ETag: nginx передаёт его без повторного сжатия
    }

    # страница сайта меняется с выпуском: браузер проверяет её при каждом заходе
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
