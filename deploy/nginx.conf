# Сайт и API платформы с одного адреса: страница обращается к /api/... без обхода политики безопасности (CSP connect-src 'self')
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # база обновляется парсером каждый день: браузер не должен держать старую копию
    location = /data.json {
        add_header Cache-Control "no-cache";
    }
}
