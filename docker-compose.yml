services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: promkoop, POSTGRES_USER: promkoop, POSTGRES_PASSWORD: change-me }
    volumes: ["./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql"]
  redis:
    image: redis:7
  api:
    build: ./backend
    environment:
      PK_DATA_DIR: /data
      DATABASE_URL: "postgresql://promkoop:change-me@db/promkoop"
      PK_CORS: "http://localhost:8080"
      # Уведомления: токен бота Telegram (@BotFather), ключ сообщества ВКонтакте, секрет вебхука бота
      PK_TG_BOT_TOKEN: ${PK_TG_BOT_TOKEN:-}
      PK_VK_GROUP_TOKEN: ${PK_VK_GROUP_TOKEN:-}
      PK_TG_WEBHOOK_SECRET: ${PK_TG_WEBHOOK_SECRET:-}
    volumes: ["./data:/data:ro"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  crawler:
    build: ./crawler
    volumes: ["./data:/data"]
    environment: { PK_DATA_DIR: /data }
    profiles: ["crawl"]
  # Ежедневная сверка с реестрами ФНС и Федресурсом (docs/SYNC.md): пишет data/ и site/data.json
  sync:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -q httpx && python -m sync --daemon --at 03:00"
    environment:
      PK_CHECKO_KEY: ${PK_CHECKO_KEY:-}
      PK_SYNC_MIN_REVENUE_K: ${PK_SYNC_MIN_REVENUE_K:-10000}
      PK_SYNC_MAX_NEW: ${PK_SYNC_MAX_NEW:-300}
      TZ: Europe/Volgograd
    volumes: ["./sync:/app/sync", "./data:/app/data", "./site:/app/site"]
    restart: unless-stopped
  web:
    image: nginx:alpine
    volumes: ["./site/dist:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
